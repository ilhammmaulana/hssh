<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');
      .term-text { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 13.5px; fill: #d1d5db; }
      .cyan-bold { fill: #38bdf8; font-weight: 700; }
      .green-bold { fill: #4ade80; font-weight: 700; }
      .yellow-bold { fill: #facc15; font-weight: 700; }
      .magenta-bold { fill: #f472b6; font-weight: 700; }
      .red-bold { fill: #f87171; font-weight: 700; }
      .gray { fill: #6b7280; }
      .white-bold { fill: #ffffff; font-weight: 700; }
    </style>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="900" height="500" rx="16" fill="#0d1117" />

  <g filter="url(#shadow2)">
    <rect x="25" y="20" width="850" height="455" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    
    <path d="M 25 30 A 10 10 0 0 1 35 20 L 865 20 A 10 10 0 0 1 875 30 L 875 58 L 25 58 Z" fill="#21262d" />
    <circle cx="50" cy="39" r="6.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
    <circle cx="70" cy="39" r="6.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
    <circle cx="90" cy="39" r="6.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>
    <text x="450" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#8b949e">god-ssh — interactive dashboard</text>
  </g>

  <g class="term-text">
    <text x="50" y="90"><tspan class="green-bold">➜</tspan> <tspan class="cyan-bold">~</tspan> <tspan class="white-bold">god-ssh</tspan></text>

    <text x="50" y="125" class="cyan-bold">   ____   ___  ____       ____ ____  _   _ </text>
    <text x="50" y="143" class="cyan-bold">  / ___| / _ \|  _ \     / ___/ ___|| | | |</text>
    <text x="50" y="161" class="cyan-bold"> | |  _ | | | | | | |____\___ \___ \| |_| |</text>
    <text x="50" y="179" class="cyan-bold"> | |_| || |_| | |_| |_____|___) |__) |  _  |</text>
    <text x="50" y="197" class="cyan-bold">  \____| \___/|____/     |____/____/|_| |_|</text>
    <text x="50" y="219" class="gray">  High-Performance Passwordless SSH Manager (Go Edition)</text>

    <text x="50" y="255" class="white-bold">What would you like to do?</text>
    <text x="50" y="280">  <tspan class="green-bold">[1]</tspan> Connect to a server (<tspan class="white-bold">god-ssh connect</tspan>)</text>
    <text x="50" y="302">  <tspan class="cyan-bold">[2]</tspan> Add new server &amp; setup passwordless key (<tspan class="white-bold">god-ssh add</tspan>)</text>
    <text x="50" y="324">  <tspan class="yellow-bold">[3]</tspan> List servers &amp; live status (<tspan class="white-bold">god-ssh list</tspan>)</text>
    <text x="50" y="346">  <tspan class="magenta-bold">[4]</tspan> Edit an existing server (<tspan class="white-bold">god-ssh edit</tspan>)</text>
    <text x="50" y="368">  <tspan class="cyan-bold">[5]</tspan> Test passwordless authentication (<tspan class="white-bold">god-ssh test</tspan>)</text>
    <text x="50" y="390">  <tspan class="white-bold">[6]</tspan> Copy SSH key to server (<tspan class="white-bold">god-ssh copy-key</tspan>)</text>
    <text x="50" y="412">  <tspan class="green-bold">[7]</tspan> Ping server reachability (<tspan class="white-bold">god-ssh ping</tspan>)</text>
    <text x="50" y="434">  <tspan class="yellow-bold">[8]</tspan> Backup ~/.ssh/config (<tspan class="white-bold">god-ssh backup</tspan>)</text>
    <text x="50" y="456">  <tspan class="red-bold">[9]</tspan> Delete a server (<tspan class="white-bold">god-ssh remove</tspan>)</text>
  </g>
</svg>
